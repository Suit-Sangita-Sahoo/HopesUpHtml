<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        query,
        where,
        onSnapshot,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* ================================
       FIREBASE CONFIG
    ================================= */

    const firebaseConfig = {

        apiKey: "AIzaSyBxAvmT6UbWpKtLxllJPn-Vimr7BFXJC4",

        authDomain: "the-hope-sup.firebaseapp.com",

        projectId: "the-hope-sup",

        storageBucket: "the-hope-sup.firebasestorage.app",

        messagingSenderId: "153836503835",

        appId: "1:153836503835:web:07e99ddbe455805c9c89be",

        measurementId: "G-7844C245GL"
    };


    /* ================================
       INITIALIZE FIREBASE
    ================================= */

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* ================================
       THIS BLOG PAGE
    ================================= */

    const PAGE_ID = "why-you-should-master-being-present";

    const PAGE_TITLE =
        "Why You Should Master The Skill of Being Present";


    /* ================================
       HTML ELEMENTS
    ================================= */

    const commentForm =
        document.getElementById("commentForm");

    const commentName =
        document.getElementById("commentName");

    const commentEmail =
        document.getElementById("commentEmail");

    const commentMessage =
        document.getElementById("commentMessage");

    const commentSubmit =
        document.getElementById("commentSubmit");

    const commentStatus =
        document.getElementById("commentStatus");

    const commentsList =
        document.getElementById("commentsList");

    const commentCount =
        document.getElementById("commentCount");


    /* ================================
       STATUS MESSAGE
    ================================= */

    function showStatus(message, type) {

        commentStatus.textContent = message;

        commentStatus.className =
            "comment-status " + type;
    }


    /* ================================
       FORMAT DATE
    ================================= */

    function formatCommentDate(timestamp) {

        if (
            !timestamp ||
            typeof timestamp.toDate !== "function"
        ) {
            return "Just now";
        }

        const date = timestamp.toDate();

        return date.toLocaleString("en-IN", {

            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true

        });
    }


    /* ================================
       CREATE COMMENT
    ================================= */

    function createCommentElement(data) {

        const comment =
            document.createElement("div");

        comment.className =
            "comment-item";


        /* Avatar */

        const avatar =
            document.createElement("div");

        avatar.className =
            "comment-avatar";


        const name =
            data.name || "Reader";

        avatar.textContent =
            name.charAt(0).toUpperCase();


        /* Content */

        const content =
            document.createElement("div");

        content.className =
            "comment-content";


        /* Top row */

        const top =
            document.createElement("div");

        top.className =
            "comment-top";


        /* Name */

        const author =
            document.createElement("span");

        author.className =
            "comment-author";

        author.textContent =
            name;


        /* Date */

        const date =
            document.createElement("span");

        date.className =
            "comment-date";

        date.textContent =
            formatCommentDate(data.createdAt);


        /* Message */

        const text =
            document.createElement("p");

        text.className =
            "comment-text";

        text.textContent =
            data.message || "";


        /* Build */

        top.appendChild(author);
        top.appendChild(date);

        content.appendChild(top);
        content.appendChild(text);

        comment.appendChild(avatar);
        comment.appendChild(content);

        return comment;
    }


    /* ================================
       POST COMMENT
    ================================= */

    commentForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const name =
                commentName.value.trim();

            const email =
                commentEmail.value.trim();

            const message =
                commentMessage.value.trim();


            /* Validation */

            if (!name) {

                showStatus(
                    "Please enter your name.",
                    "error"
                );

                commentName.focus();

                return;
            }


            if (!message) {

                showStatus(
                    "Please write a comment.",
                    "error"
                );

                commentMessage.focus();

                return;
            }


            if (name.length > 50) {

                showStatus(
                    "Your name must be 50 characters or less.",
                    "error"
                );

                return;
            }


            if (email.length > 100) {

                showStatus(
                    "Your email must be 100 characters or less.",
                    "error"
                );

                return;
            }


            if (message.length > 500) {

                showStatus(
                    "Your comment must be 500 characters or less.",
                    "error"
                );

                return;
            }


            /* Disable button */

            commentSubmit.disabled = true;

            commentSubmit.innerHTML =
                "<span>Posting...</span>";


            try {

                /* Save comment */

                await addDoc(
                    collection(db, "comments"),
                    {

                        pageId: PAGE_ID,

                        pageTitle: PAGE_TITLE,

                        name: name,

                        email: email,

                        message: message,

                        createdAt:
                            serverTimestamp()

                    }
                );


                /* Clear form */

                commentForm.reset();


                showStatus(
                    "Thank you! Your comment has been posted.",
                    "success"
                );

            }

            catch (error) {

                console.error(
                    "Error posting comment:",
                    error
                );

                showStatus(
                    "Unable to post your comment. Please try again.",
                    "error"
                );

            }


            /* Enable button */

            commentSubmit.disabled = false;

            commentSubmit.innerHTML = `
                <span>Post Comment</span>
                <span>→</span>
            `;

        }
    );


    /* ================================
       GET COMMENTS
       
       IMPORTANT:
       No orderBy() here.
       This avoids composite-index problems.
    ================================= */

    const commentsQuery = query(

        collection(db, "comments"),

        where(
            "pageId",
            "==",
            PAGE_ID
        )

    );


    /* ================================
       DISPLAY COMMENTS
    ================================= */

    onSnapshot(

        commentsQuery,

        function (snapshot) {

            commentsList.innerHTML = "";


            /* Convert Firestore documents
               into normal objects */

            const comments =
                snapshot.docs
                    .map(function (doc) {

                        return {
                            id: doc.id,
                            ...doc.data()
                        };

                    })
                    .sort(function (a, b) {

                        const aTime =
                            a.createdAt &&
                            typeof a.createdAt.toMillis === "function"
                                ? a.createdAt.toMillis()
                                : 0;

                        const bTime =
                            b.createdAt &&
                            typeof b.createdAt.toMillis === "function"
                                ? b.createdAt.toMillis()
                                : 0;

                        return bTime - aTime;

                    });


            /* Comment count */

            const total =
                comments.length;


            if (total === 0) {

                commentCount.textContent =
                    "0 comments";

            }

            else if (total === 1) {

                commentCount.textContent =
                    "1 comment";

            }

            else {

                commentCount.textContent =
                    total + " comments";

            }


            /* No comments */

            if (total === 0) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "comments-empty";

                empty.textContent =
                    "No comments yet. Be the first to share your thoughts.";

                commentsList.appendChild(empty);

                return;
            }


            /* Display comments */

            comments.forEach(function (data) {

                const comment =
                    createCommentElement(data);

                commentsList.appendChild(comment);

            });

        },


        /* ================================
           FIRESTORE ERROR
        ================================= */

        function (error) {

            console.error(
                "Loading comments failed:",
                error
            );

            commentCount.textContent =
                "Comments unavailable";

            commentsList.innerHTML = "";

            const errorMessage =
                document.createElement("div");

            errorMessage.className =
                "comments-empty";

            errorMessage.textContent =
                "Comments could not be loaded right now.";

            commentsList.appendChild(
                errorMessage
            );

        }

    );

</script>
